<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1 id="titulo">Calculadora</h1>
    <label for="nome">Nome:</label>
    <input id="nome" type="text">
    <label for="nota1">Nota 1:</label>
    <input id="nota1" type="number" min="0" max="10">
    <label for="nota2">Nota 2:</label>
    <input id="nota2" type="number" min="0" max="10">
    <label for="nota3">Nota 3:</label>
    <input id="nota3" type="number" min="0" max="10">
    <button id="calcular" type="button">Calcular</button>
    <p id="resultado" aria-live="polite">Aguardando...</p>
</div>
<script src="script.js"></script>
</body>
</html>
